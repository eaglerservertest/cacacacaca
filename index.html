<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>PyScriptのテスト</title>
    <!-- PyScriptのCSSとJavaScriptを読み込む -->
    <link rel="stylesheet" href="https://pyscript.net" />
    <script type="module" src="https://pyscript.net"></script>
</head>
<body>
    <h1>こんにちは、PyScript!</h1>
    
    <!-- py-scriptタグの中にPythonコードを書く -->
    <py-script>
        print("Hello, Python from HTML!")
        
        # 足し算の計算結果を出力
        a = 10
        b = 20
        print(f"計算結果: {a + b}")
    </py-script>
</body>
</html>
